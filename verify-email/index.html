<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>Verify your email · Inetixus</title><link rel="canonical" href="https://dashboard.inetixus.it/verify-email/"><link rel="icon" href="/site/favicon.svg" type="image/svg+xml"><link rel="preload" href="/site/fonts/NeueMontreal-Medium.otf" as="font" type="font/otf" crossorigin><link rel="stylesheet" href="/account.css?v=portal-3"><script type="module" src="/account.js?v=portal-3"></script></head><body data-account-page="verify-email"><header class="account-header"><a href="/" aria-label="Inetixus home"><img src="/site/inetixus.svg" width="128" height="39" alt="Inetixus"></a><a class="back-link" href="/">Back to portfolio <span aria-hidden="true">↗</span></a></header><main class="verification-layout"><section class="verification-panel" aria-labelledby="account-title"><p class="eyebrow">EMAIL VERIFICATION</p><h1 id="account-title">Confirm your email.</h1><p class="account-intro">Enter the six-digit code sent to<br><span data-verification-address>your email address</span>.</p><form data-account-form><details class="verification-email"><summary>Change email address</summary><div class="field"><label for="email">Email address</label><div class="input-wrap"><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div></div></details><label class="code-label" for="verification-code">Verification code</label><div class="code-entry"><div class="code-cells"><span class="code-cell" aria-hidden="true"></span><span class="code-cell" aria-hidden="true"></span><span class="code-cell" aria-hidden="true"></span><span class="code-cell" aria-hidden="true"></span><span class="code-cell" aria-hidden="true"></span><span class="code-cell" aria-hidden="true"></span></div><input id="verification-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required aria-describedby="code-hint"></div><p class="hint" id="code-hint">You can paste your code here.</p><button class="submit-button" type="submit">Confirm email <span aria-hidden="true">↗</span></button></form><p class="form-status" role="status" aria-live="polite" tabindex="-1" hidden></p><p class="verification-resend">Didn't receive it? <button class="resend-code" type="button" data-resend>Resend code</button></p><p class="account-switch"><a href="/login/">Back to login</a></p></section></main></body></html>
